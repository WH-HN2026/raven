id: asi-cookie-jsessionid
info:
  name: Java servlet session cookie
  author: asi
  severity: info
  description: The response sets JSESSIONID, the Java servlet container session cookie.
  tags: asi,cookies,tech,java
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers:
      - type: regex
        part: header
        regex:
          - '(?mi)^set-cookie:[ \t]*JSESSIONID='
