id: raven-footer-version
info:
  name: Version number in the page footer
  author: raven
  severity: info
  description: The page footer shows a software version (e.g. "version 3.2.1", "v2.4").
  tags: raven,version,footer
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers:
      - type: regex
        part: body
        regex:
          - '(?is)<footer[^>]*>.{0,1000}?\b(v|ver\.?|version)\s*[0-9]+\.[0-9]+'
    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?is)<footer[^>]*>.{0,1000}?\b((?:v|ver\.?|version)\s*[0-9]+\.[0-9]+(?:\.[0-9]+)?)'
