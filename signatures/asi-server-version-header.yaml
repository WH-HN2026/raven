id: asi-server-version-header
info:
  name: Server header discloses a version
  author: asi
  severity: info
  description: The Server response header names a product together with its version.
  tags: asi,headers,version
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers:
      - type: regex
        part: header
        regex:
          - '(?mi)^server:[ \t]*[a-z0-9_.-]+/[0-9]+\.[0-9]+'
    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?mi)^server:[ \t]*([^\r\n]+)'
