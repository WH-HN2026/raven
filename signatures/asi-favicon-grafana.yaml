id: asi-favicon-grafana
info:
  name: Grafana favicon
  author: asi
  severity: info
  description: The favicon mmh3 hash is the Grafana favicon (2123863676).
  tags: asi,favicon,panel,grafana
http:
  - method: GET
    path:
      - "{{BaseURL}}/public/img/fav32.png"
      - "{{BaseURL}}/favicon.ico"
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && ("2123863676" == mmh3(base64_py(body)))'
