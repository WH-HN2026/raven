id: raven-missing-csp
info:
  name: HTML page without Content-Security-Policy
  author: raven
  severity: info
  description: An HTML page is served without a Content-Security-Policy header.
  tags: raven,headers,misconfig,csp
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        case-insensitive: true
        words:
          - "content-type: text/html"
      - type: word
        part: header
        negative: true
        case-insensitive: true
        words:
          - "content-security-policy:"
