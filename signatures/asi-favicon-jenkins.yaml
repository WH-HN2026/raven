id: asi-favicon-jenkins
info:
  name: Jenkins favicon
  author: asi
  severity: info
  description: The favicon mmh3 hash is the Jenkins favicon (81586312).
  tags: asi,favicon,panel,jenkins
http:
  - method: GET
    path:
      - "{{BaseURL}}/favicon.ico"
    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && ("81586312" == mmh3(base64_py(body)))'
