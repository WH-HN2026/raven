id: asi-wp-admin
info:
  name: WordPress admin
  author: asi
  severity: info
  description: GET /wp-admin/ redirects to (or shows) the WordPress login.
  tags: asi,panel,wordpress,path
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-admin/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 301
          - 302
      - type: word
        part: all
        words:
          - "wp-login.php"
