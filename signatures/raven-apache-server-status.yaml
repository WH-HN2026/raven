id: raven-apache-server-status
info:
  name: Apache server-status page
  author: raven
  severity: low
  description: The Apache mod_status page is public at /server-status.
  tags: raven,apache,exposure,path
http:
  - method: GET
    path:
      - "{{BaseURL}}/server-status"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "Apache Server Status for"
