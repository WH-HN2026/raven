id: raven-cookie-wordpress
info:
  name: WordPress cookie
  author: raven
  severity: info
  description: The response sets a WordPress cookie (wordpress_*, wordpress_test_cookie or wp-settings-*).
  tags: raven,cookies,tech,wordpress
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/wp-login.php"
    stop-at-first-match: true
    matchers:
      - type: regex
        part: header
        regex:
          - '(?mi)^set-cookie:[ \t]*(wordpress_[a-z0-9_]*|wp-settings-[0-9]+)='
