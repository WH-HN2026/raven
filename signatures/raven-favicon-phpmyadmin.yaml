id: raven-favicon-phpmyadmin
info:
  name: phpMyAdmin favicon
  author: raven
  severity: info
  description: The favicon mmh3 hash is the phpMyAdmin favicon (-476231906).
  tags: raven,favicon,panel,phpmyadmin
http:
  - method: GET
    path:
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/phpmyadmin/favicon.ico"
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && ("-476231906" == mmh3(base64_py(body)))'
