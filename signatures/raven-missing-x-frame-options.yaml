id: raven-missing-x-frame-options
info:
  name: HTML page can be framed
  author: raven
  severity: info
  description: An HTML page has neither X-Frame-Options nor a CSP frame-ancestors directive.
  tags: raven,headers,misconfig,clickjacking
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        case-insensitive: true
        words:
          - "content-type: text/html"
      - type: word
        part: header
        negative: true
        case-insensitive: true
        words:
          - "x-frame-options:"
          - "frame-ancestors"
