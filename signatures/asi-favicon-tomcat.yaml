id: asi-favicon-tomcat
info:
  name: Apache Tomcat favicon
  author: asi
  severity: info
  description: The favicon mmh3 hash is the default Apache Tomcat favicon (-297069493).
  tags: asi,favicon,panel,tomcat
http:
  - method: GET
    path:
      - "{{BaseURL}}/favicon.ico"
    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && ("-297069493" == mmh3(base64_py(body)))'
