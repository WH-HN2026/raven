id: raven-toxiproxy-api
info:
  name: Toxiproxy API
  author: raven
  severity: low
  description: >-
    The Toxiproxy control API answers without authentication. Toxiproxy refuses
    browser User-Agents with 403 (still with its request id header), so the
    request sends a plain one to read the version.
  tags: raven,panel,toxiproxy,version
http:
  - method: GET
    path:
      - "{{BaseURL}}/version"
    headers:
      User-Agent: raven
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 403
      - type: regex
        part: header
        regex:
          - '(?im)^X-Toxiproxy-Request-Id:'
    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"v?([0-9]+\.[0-9]+[0-9A-Za-z.+~-]*)"'
