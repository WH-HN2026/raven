id: raven-actuator-health
info:
  name: Spring Boot Actuator health endpoint
  author: raven
  severity: low
  description: GET /actuator/health answers with the Spring Boot Actuator health document.
  tags: raven,springboot,actuator,path
http:
  - method: GET
    path:
      - "{{BaseURL}}/actuator/health"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '"status"\s*:\s*"(UP|DOWN|OUT_OF_SERVICE|UNKNOWN)"'
