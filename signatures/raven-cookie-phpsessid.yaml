id: raven-cookie-phpsessid
info:
  name: PHP session cookie
  author: raven
  severity: info
  description: The response sets PHPSESSID, the default PHP session cookie.
  tags: raven,cookies,tech,php
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers:
      - type: regex
        part: header
        regex:
          - '(?mi)^set-cookie:[ \t]*PHPSESSID='
