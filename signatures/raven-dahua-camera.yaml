id: raven-dahua-camera
info:
  name: Dahua camera / DVR
  author: raven
  severity: low
  description: The Dahua web interface title ("WEB SERVICE").
  tags: raven,iot,camera,dahua,title
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "<title>WEB SERVICE</title>"
