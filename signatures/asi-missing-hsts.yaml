id: asi-missing-hsts
info:
  name: HTML page without Strict-Transport-Security
  author: asi
  severity: info
  description: An HTML page is served without an HSTS header (relevant on HTTPS services).
  tags: asi,headers,misconfig,hsts
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        case-insensitive: true
        words:
          - "content-type: text/html"
      - type: word
        part: header
        negative: true
        case-insensitive: true
        words:
          - "strict-transport-security:"
