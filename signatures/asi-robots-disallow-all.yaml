id: asi-robots-disallow-all
info:
  name: robots.txt blocks all crawlers
  author: asi
  severity: info
  description: robots.txt disallows the whole site for every user agent, a common staging/test marker.
  tags: asi,staging,robots
http:
  - method: GET
    path:
      - "{{BaseURL}}/robots.txt"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        condition: and
        regex:
          - '(?im)^user-agent:\s*\*\s*$'
          - '(?im)^disallow:\s*/\s*$'
