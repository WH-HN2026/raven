openapi: 3.1.0
info:
  title: ASI — Attack Surface Intelligence API
  version: 0.1.0
  description: |
    The HTTP contract between the Go backend and the SPA (architecture §7).
    Conventions:
    - JSON everywhere; lists take `?limit=&offset=` and return `{items, total}`.
    - Errors return `{error: {code, message}}`.
    - Auth: session cookie `asi_session` (HttpOnly, SameSite=Strict) from POST /api/auth/login.
    - Every POST/PUT/PATCH/DELETE must send the header `X-ASI-CSRF: 1` (login included).
    - 401 = no session, 403 = missing permission (or missing CSRF header).
    - Paths marked "stub" are mounted with their permission but answer 501 until their task lands.
    Editing rules: add paths/schemas inside your area's section (grouped by tag); run `make gen`.
servers:
  - url: /api
tags:
  - name: system
  - name: auth
  - name: targets
  - name: scope
  - name: runs
  - name: hosts
  - name: findings
  - name: changes
  - name: profiles
  - name: schedules
  - name: signatures
  - name: exchange
  - name: users

security:
  - session: []

paths:
  # ───────────────────────── system ─────────────────────────
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      security: []
      responses:
        "200":
          description: Server and database are up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  # ───────────────────────── auth ─────────────────────────
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; sets the session cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Logged out; clears the session cookie. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      tags: [auth]
      operationId: me
      responses:
        "200":
          description: The current user, role and permissions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me/password:
    patch:
      tags: [auth]
      operationId: changeOwnPassword
      description: >-
        Any logged-in user. 400 wrong_password if current_password is wrong. Revokes
        the user's other sessions; the current one stays.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Password changed. }
        default: { $ref: "#/components/responses/Error" }

  # ───────────────────────── targets (S1, W1) ─────────────────────────
  /targets:
    get:
      tags: [targets]
      operationId: listTargets
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [targets]
      operationId: createTargets
      description: |
        Manual entry of one or more targets (permission targets:write). Kind is auto-detected
        (ip / cidr / domain); if `kind` is given it must match. All items must be valid, otherwise
        nothing is written and the 400 response lists `errors` (line = 1-based item index).
        Re-adding an existing target merges its tags. Target rules: IPv4 only; no loopback,
        link-local, multicast or unspecified addresses; CIDRs at most a /16.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets:
                  type: array
                  items: { $ref: "#/components/schemas/TargetInput" }
      responses:
        "201":
          description: Created (or merged) targets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetList" }
        "400":
          description: Invalid targets; nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetInputErrors" }
        default: { $ref: "#/components/responses/Error" }
  /targets/upload:
    post:
      tags: [targets]
      operationId: uploadTargets
      description: |
        CSV or JSON upload (permission import), multipart field `file`, max 10 MiB.
        `dry_run=true` only parses and returns a preview (nothing is written); otherwise the valid
        entries are stored (tags merged into existing targets) and the bad lines are reported.
        The format comes from the file name (`.json`, `.csv`/`.txt`), else a leading `[` means JSON.

        CSV: columns `value,tags,note`; the header row is optional (first cell `value`); tags are
        separated by `;` or `|`; tags and note may be omitted; blank lines and `#` lines are skipped.
        ```
        value,tags,note
        10.0.0.0/24,lab;web,main lab net
        wordpress.lab,cms,
        10.0.0.7
        ```
        JSON: an array of `{value, tags?, note?, kind?}`; error lines point at the line where the
        bad element starts.
        ```
        [{"value": "10.0.0.0/24", "tags": ["lab"], "note": "main lab net"}, {"value": "wordpress.lab"}]
        ```
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: dry_run, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Parse result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetUploadResult" }
        default: { $ref: "#/components/responses/Error" }
  /targets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      tags: [targets]
      operationId: deleteTarget
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }

  # ───────────────────────── scope (S1, W1) ─────────────────────────
  /scope:
    get:
      tags: [scope]
      operationId: listScope
      parameters:
        - { name: profile_id, in: query, schema: { type: integer, format: int64 }, description: "omit = global entries" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Scope entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeEntryList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [scope]
      operationId: createScopeEntry
      description: |
        Global entries (profile_id null: the global include list and the global blacklist) need
        scope:global on top of scope:write. Kind is auto-detected. Scope CIDRs have no size cap.
        A run applies: the include entries (global + profile; if there are none, the targets themselves
        are the include set), then all exclude entries last; exclusions always win. Domain entries match
        their resolved IPs and any host name equal to or under the domain. 409 = duplicate entry.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScopeEntryInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeEntry" }
        default: { $ref: "#/components/responses/Error" }
  /scope/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      tags: [scope]
      operationId: deleteScopeEntry
      description: Global entries need scope:global.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }

  # ───────────────────────── runs (S3, W2) ─────────────────────────
  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      parameters:
        - { name: profile_id, in: query, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Runs, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [runs]
      operationId: startRun
      description: |
        Start a run for a profile (runs:control). Builds the scan list (targets + scope), splits it into
        fixed-size batches and enqueues one job per batch. An empty scan list gives a run that is `done`
        immediately, with `stats.reason`. 409 if the profile already has a pending or running run;
        400 for an unknown or disabled profile.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_id]
              properties:
                profile_id: { type: integer, format: int64 }
      responses:
        "201":
          description: Created run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }
  /runs/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRun
      description: One run with batch progress; poll it while the run is pending/running.
      responses:
        "200":
          description: Run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }
  /runs/{id}/batches:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: listRunBatches
      description: All batches of the run, in order (not paginated).
      responses:
        "200":
          description: Batches of the run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchList" }
        default: { $ref: "#/components/responses/Error" }
  /runs/{id}/stop:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [runs]
      operationId: stopRun
      description: |
        Stop a pending/running run (runs:control): unfinished batches become `stopped`, their scans are
        cancelled, and the run becomes `stopped`. 409 if the run is not active.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200":
          description: Stopped run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────────────────── hosts (S3, W3, W10) ─────────────────────────
  /hosts:
    get:
      tags: [hosts]
      operationId: listHosts
      description: Hosts ordered by IP. All filters are optional and combined with AND.
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/HostState" } }
        - { name: port, in: query, schema: { type: integer, minimum: 0, maximum: 65535 }, description: "has an open service on this port" }
        - { name: tech, in: query, schema: { type: string }, description: "technology seen in any HTTP observation of the host (case-insensitive)" }
        - { name: tag, in: query, schema: { type: string }, description: "user tag (exact)" }
        - { name: q, in: query, schema: { type: string }, description: "IP or CIDR (containment); otherwise IP text prefix or hostname substring" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Hosts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostList" }
        default: { $ref: "#/components/responses/Error" }
  /hosts/{ip}:
    parameters:
      - { name: ip, in: path, required: true, schema: { type: string } }
    get:
      tags: [hosts]
      operationId: getHost
      description: |
        Host with all its services (user overrides applied, banner decrypted), the latest
        HTTP observation per URL (headers/cookies/TLS decrypted) and the last 20 host-level
        up/down observations. 400 for a malformed IP, 404 for an unknown host.
      responses:
        "200":
          description: Host with services and HTTP observations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostDetail" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [hosts]
      operationId: updateHost
      description: |
        Edits user-owned fields only (owner, criticality, notes, user_tags; absent = unchanged).
        notes are stored encrypted. The result is then written to the IP's Dojo asset: description
        (owner, criticality, notes) and tags (user tags as `user:<tag>`; all other tags are kept).
        `dojo_sync` reports that write: synced, pending (no asset yet or Dojo not ready), failed.
        400 for invalid values, 404 for an unknown host.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostPatch" }
      responses:
        "200":
          description: Updated host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostEditResult" }
        default: { $ref: "#/components/responses/Error" }
  /services:
    get:
      tags: [hosts]
      operationId: listServices
      description: stub
      parameters:
        - { name: port, in: query, schema: { type: integer } }
        - { name: product, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [open, gone] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Services.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceList" }
        default: { $ref: "#/components/responses/Error" }
  /services/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [hosts]
      operationId: updateService
      description: |
        Writes `overrides` only, merged into the stored ones: keys name, product, version; a string
        sets the key, null clears it, absent keys are unchanged. 400 for other keys or values.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                overrides:
                  type: object
                  properties:
                    name: { type: [string, "null"] }
                    product: { type: [string, "null"] }
                    version: { type: [string, "null"] }
                  additionalProperties: false
      responses:
        "200":
          description: Updated service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        default: { $ref: "#/components/responses/Error" }

  /cve-matches:
    get:
      tags: [hosts]
      operationId: listCveMatches
      description: Offline CVE matches (C3), one per product instance, highest CVSS first.
      parameters:
        - { name: ip, in: query, required: false, schema: { type: string }, description: Only this IP. }
      responses:
        "200":
          description: Matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CveMatchList" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────────────────── findings (D3, D6, W5) ─────────────────────────
  /findings:
    get:
      tags: [findings]
      operationId: listFindings
      description: >-
        Reads only the Dojo mirror (dojo_findings, synced every 5 min from findings tagged "asi");
        never calls Dojo. Sorted by severity (Critical first), then date (newest first).
      parameters:
        - name: severity
          in: query
          description: Any of these; repeat the parameter or separate with commas. Case-insensitive.
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/Severity" } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: ip, in: query, description: An IP address or a CIDR., schema: { type: string } }
        - { name: q, in: query, description: Case-insensitive substring of the title., schema: { type: string } }
        - { name: scanner, in: query, description: "nmap, nuclei, asi (our INFO findings), …", schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingList" }
        default: { $ref: "#/components/responses/Error" }
  /findings/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [findings]
      operationId: updateFinding
      description: |
        Write-through: PATCHes the finding in Dojo, then updates the mirror row from Dojo's answer.
        Only findings in the mirror can be edited (404 otherwise). Implied changes are added so Dojo
        accepts the patch: active=true clears false_p/risk_accepted/is_mitigated; false_p=true clears
        active and verified; risk_accepted=true or is_mitigated=true clears active. Contradictions
        are 400; 503 while Dojo is not ready; 502 if Dojo fails.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingPatch" }
      responses:
        "200":
          description: Updated finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        default: { $ref: "#/components/responses/Error" }
  /findings/{id}/notes:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [findings]
      operationId: addFindingNote
      description: Adds a note to the finding in Dojo (notes are not mirrored). 404 if not in the mirror, 503 while Dojo is not ready.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "204": { description: Added. }
        default: { $ref: "#/components/responses/Error" }

  # ───────────────────────── changes (C1, W6) ─────────────────────────
  /changes:
    get:
      tags: [changes]
      operationId: getChanges
      description: |
        Diff between two runs (read). Defaults: `to` = the latest done run (of `from`'s profile if `from` is given),
        `from` = the done run of `to`'s profile right before it. Hosts: new = up in `to` and not up in `from`;
        gone = up in `from` and down in `to`. Services are compared only on hosts up in both runs.
        Each list is capped at `limit`; `summary` has the full counts.
      parameters:
        - { name: from, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: to, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 } }
      responses:
        "200":
          description: Changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDiff" }
        default: { $ref: "#/components/responses/Error" }
  /changes/hosts/{ip}:
    get:
      tags: [changes]
      operationId: getHostTimeline
      description: Host and port up/down in the last `runs` runs that scanned this IP, newest first (read).
      parameters:
        - { name: ip, in: path, required: true, schema: { type: string } }
        - { name: runs, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
      responses:
        "200":
          description: Timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostTimeline" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────────────────── profiles (W7) ─────────────────────────
  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      description: All scan profiles, ordered by name (read). Used by the Runs page to pick a profile.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [profiles]
      operationId: createProfile
      description: stub
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }
  /profiles/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [profiles]
      operationId: updateProfile
      description: stub
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [profiles]
      operationId: deleteProfile
      description: stub
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }

  # ───────────────────────── schedules (P1, D5, W7) ─────────────────────────
  /schedules:
    get:
      tags: [schedules]
      operationId: listSchedules
      description: stub
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Schedules from the UI and Dojo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [schedules]
      operationId: createSchedule
      description: stub
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        default: { $ref: "#/components/responses/Error" }
  /schedules/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [schedules]
      operationId: updateSchedule
      description: stub. Dojo-sourced schedules are read-only (409).
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      description: stub
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }

  # ───────────────────────── signatures (C2, W8) ─────────────────────────
  /signatures:
    get:
      tags: [signatures]
      operationId: listSignatures
      description: Signatures, built-ins first.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Signatures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [signatures]
      operationId: createSignature
      description: >-
        Validate and store a template. A template that fails the safe-subset
        validator is still stored, disabled, with `valid=false` and its
        `validation_error`; only a template without a usable `id` is rejected (400).
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignatureInput" }
      responses:
        "201":
          description: Created (validated).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signature" }
        "400":
          description: No usable template id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureInvalid" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /signatures/validate:
    post:
      tags: [signatures]
      operationId: validateSignature
      description: Validate a template against the safe subset without saving.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_yaml]
              properties:
                template_yaml: { type: string }
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureValidation" }
        default: { $ref: "#/components/responses/Error" }
  /signatures/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [signatures]
      operationId: getSignature
      responses:
        "200":
          description: The signature.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signature" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [signatures]
      operationId: updateSignature
      description: >-
        Partial update. A new template is re-validated (invalid → stored disabled).
        Enabling an invalid signature is 400; changing a built-in's template is 403.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignatureUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signature" }
        "400":
          description: Invalid template id, or enabling an invalid signature.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureInvalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [signatures]
      operationId: deleteSignature
      description: Built-in signatures can't be deleted (403).
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /signatures/{id}/test:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [signatures]
      operationId: testSignature
      description: >-
        stub (501) until the nuclei scanner (S4) exposes a single-template run.
        Will run this signature against one lab URL and return the matches.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        "501": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ───────────────────────── exchange (P3) ─────────────────────────
  /import/results:
    post:
      tags: [exchange]
      operationId: importResults
      description: stub. Import scan results (our JSON/CSV format) through the ingest + push path.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Accepted; a run was created for the import.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }
  /export/{kind}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [hosts, services, findings, changes] } }
      - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
    get:
      tags: [exchange]
      operationId: exportData
      description: stub. Accepts the same filters as the matching list endpoint.
      responses:
        "200":
          description: Export file.
          content:
            application/json: { schema: {} }
            text/csv: { schema: { type: string } }
        default: { $ref: "#/components/responses/Error" }

  # ───────────────────────── users (P2, W9) ─────────────────────────
  /users:
    get:
      tags: [users]
      operationId: listUsers
      description: "Requires users:admin. Ordered by username."
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [users]
      operationId: createUser
      description: "Requires users:admin. Password: at least 12 characters. 409 if the username exists."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
  /users/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [users]
      operationId: updateUser
      description: >-
        Requires users:admin. 409 (not_allowed) when changing your own role, disabling
        yourself, or demoting/disabling the last enabled admin. A role change, disabling
        or a password reset revokes the user's sessions.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [users]
      operationId: deleteUser
      description: "Requires users:admin. 409 (not_allowed) for yourself or the last enabled admin."
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: asi_session

  parameters:
    CSRF:
      name: X-ASI-CSRF
      in: header
      required: true
      description: Must be "1" on every unsafe request. The client in web/src/api/client.ts sends it.
      schema: { type: string, enum: ["1"] }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not logged in, or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Missing permission or CSRF header.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ── common ──
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [forbidden, not_found, csrf, invalid_credentials] }
            message: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Pagination:
      description: Every list response is `{items, total}`; see the *List schemas.
      type: object
      required: [total]
      properties:
        total: { type: integer, description: total matching rows, ignoring limit/offset }
    Severity:
      type: string
      enum: [Info, Low, Medium, High, Critical]
    HostState:
      type: string
      enum: [active, unstable, inactive]
    TargetKind:
      type: string
      enum: [ip, cidr, domain]

    # ── auth / users ──
    Role:
      type: string
      enum: [admin, editor, operator, viewer]
    Permission:
      type: string
      description: See internal/auth/rbac.go.
      enum:
        - read
        - export
        - findings:edit
        - hosts:edit
        - targets:write
        - scope:write
        - profiles:write
        - schedules:write
        - signatures:write
        - import
        - runs:control
        - users:admin
        - tokens:admin
        - settings:admin
        - scope:global
        - audit:read
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    User:
      type: object
      required: [id, username, role]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
    UserInput:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._@-]{0,63}$" }
        password: { type: string, format: password, minLength: 12 }
        role: { $ref: "#/components/schemas/Role" }
    UserPatch:
      type: object
      properties:
        password: { type: string, format: password, minLength: 12 }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 12 }
    UserList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        total: { type: integer }
    Me:
      type: object
      required: [user, permissions]
      properties:
        user: { $ref: "#/components/schemas/User" }
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }

    # ── targets / scope ──
    TargetInput:
      type: object
      required: [value]
      properties:
        value: { type: string, description: "IP, CIDR or domain", examples: ["10.0.0.0/24", "example.agh.edu.pl"] }
        kind: { $ref: "#/components/schemas/TargetKind" }
        tags: { type: array, items: { type: string } }
        note: { type: string }
    TargetInputErrors:
      type: object
      required: [error, errors]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [invalid_targets] }
            message: { type: string }
        errors: { type: array, items: { $ref: "#/components/schemas/LineError" } }
    LineError:
      type: object
      required: [line, message]
      properties:
        line: { type: integer, description: 1-based input line (JSON - line where the element starts; manual POST - item index) }
        message: { type: string }
    Target:
      type: object
      required: [id, kind, value, source, tags]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/TargetKind" }
        value: { type: string }
        source: { type: string, enum: [manual, csv, json, dojo] }
        tags: { type: array, items: { type: string } }
        note: { type: string }
        created_by: { type: [integer, "null"], format: int64 }
        created_at: { type: string, format: date-time }
    TargetList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Target" } }
        total: { type: integer }
    TargetUploadResult:
      type: object
      required: [targets, errors, source, dry_run, created]
      properties:
        targets:
          description: Parsed valid entries (de-duplicated, kind detected, values normalized).
          type: array
          items: { $ref: "#/components/schemas/ParsedTarget" }
        errors: { type: array, items: { $ref: "#/components/schemas/LineError" } }
        source: { type: string, enum: [csv, json] }
        dry_run: { type: boolean }
        created: { type: integer, description: "targets written (0 on dry_run)" }
    ParsedTarget:
      type: object
      required: [kind, value, tags]
      properties:
        kind: { $ref: "#/components/schemas/TargetKind" }
        value: { type: string }
        tags: { type: array, items: { type: string } }
        note: { type: string }
    ScopeEntryInput:
      type: object
      required: [value, list]
      properties:
        kind: { $ref: "#/components/schemas/TargetKind", description: "optional; auto-detected" }
        value: { type: string }
        list: { type: string, enum: [include, exclude] }
        profile_id: { type: [integer, "null"], format: int64, description: "null = global" }
        note: { type: string }
    ScopeEntry:
      allOf:
        - $ref: "#/components/schemas/ScopeEntryInput"
        - type: object
          required: [id, kind]
          properties:
            id: { type: integer, format: int64 }
            created_by: { type: [integer, "null"], format: int64 }
            created_at: { type: string, format: date-time }
    ScopeEntryList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ScopeEntry" } }
        total: { type: integer }

    # ── runs ──
    RunStatus:
      type: string
      enum: [pending, running, suspended, done, failed, stopped]
    Run:
      type: object
      required: [id, profile_id, status, created_at, hosts_total, hosts_up, batches_total, batches_done, batches_failed, stats]
      properties:
        id: { type: integer, format: int64 }
        profile_id: { type: integer, format: int64 }
        schedule_id: { type: [integer, "null"], format: int64 }
        status: { $ref: "#/components/schemas/RunStatus" }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        hosts_total: { type: integer }
        hosts_up: { type: integer }
        batches_total: { type: integer }
        batches_done: { type: integer, description: "batches with status done" }
        batches_failed: { type: integer, description: "batches that failed after all retries" }
        stats:
          type: object
          additionalProperties: true
          description: |
            Scan list stats (candidates, not_included, excluded, rejected, warnings, batch_size) from the start;
            when finished also batches, batches_done/failed/stopped, duration_ms_sum, duration_ms_max,
            services_open; `reason` for an empty scan list.
    RunList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Run" } }
        total: { type: integer }
    Batch:
      type: object
      required: [id, run_id, seq, status, host_count, hosts_up, attempts, error]
      properties:
        id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        seq: { type: integer }
        host_count: { type: integer, description: IPs in the batch }
        hosts_up: { type: integer, description: IPs that responded }
        status: { type: string, enum: [pending, running, done, failed, stopped] }
        error: { type: string, description: "last attempt's error, empty if none" }
        attempts: { type: integer }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        duration_ms: { type: [integer, "null"] }
    BatchList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Batch" } }
        total: { type: integer }

    # ── hosts / services ──
    Host:
      type: object
      required: [ip, hostnames, state, first_seen, last_seen, miss_count, dojo_asset_id, open_service_count, open_ports, technologies, owner, criticality, user_tags, overrides]
      properties:
        ip: { type: string }
        hostnames: { type: array, items: { type: string } }
        state: { $ref: "#/components/schemas/HostState" }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        miss_count: { type: integer }
        dojo_asset_id: { type: [integer, "null"], format: int64 }
        open_service_count: { type: integer, description: "services in state open (port/proto pairs)" }
        open_ports: { type: array, items: { type: integer }, description: "distinct open ports, ascending" }
        technologies: { type: array, items: { type: string }, description: "from HTTP observations, sorted" }
        # user-owned
        owner: { type: string }
        criticality: { type: string, enum: ["", low, medium, high, critical] }
        user_tags: { type: array, items: { type: string } }
        overrides: { type: object, additionalProperties: true }
    HostPatch:
      type: object
      description: User-owned fields only.
      properties:
        owner: { type: string }
        criticality: { type: string, enum: ["", low, medium, high, critical] }
        notes: { type: string }
        user_tags: { type: array, items: { type: string }, description: "lowercase a-z 0-9 . _ / -; deduped and sorted" }
    HostDetail:
      allOf:
        - $ref: "#/components/schemas/Host"
        - type: object
          required: [notes, services, http, timeline]
          properties:
            notes: { type: string, description: decrypted }
            services: { type: array, items: { $ref: "#/components/schemas/Service" } }
            http: { type: array, items: { $ref: "#/components/schemas/HttpObservation" }, description: "latest per (service, URL); empty until nuclei (S4) runs" }
            timeline: { type: array, items: { $ref: "#/components/schemas/HostObservation" }, description: "newest first" }
    HostEditResult:
      allOf:
        - $ref: "#/components/schemas/HostDetail"
        - type: object
          required: [dojo_sync]
          properties:
            dojo_sync: { type: string, enum: [synced, pending, failed] }
    HostObservation:
      type: object
      required: [run_id, up, observed_at]
      properties:
        run_id: { type: integer, format: int64 }
        up: { type: boolean }
        observed_at: { type: string, format: date-time }
    HostList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Host" } }
        total: { type: integer }
    ServiceFields:
      type: object
      required: [name, product, version]
      properties:
        name: { type: string }
        product: { type: string }
        version: { type: string }
    Service:
      type: object
      description: |
        name/product/version are the effective values: `overrides` (user edits) layered on the scan
        values (architecture §5). `scan` holds what the scanner saw; `overridden` names the fields
        taken from overrides.
      required: [id, ip, port, proto, name, product, version, scan, overridden, banner, state, first_seen, last_seen, overrides]
      properties:
        id: { type: integer, format: int64 }
        ip: { type: string }
        port: { type: integer }
        proto: { type: string, enum: [tcp, udp] }
        name: { type: string }
        product: { type: string }
        version: { type: string }
        cpe: { type: string, description: "normalized vendor:product or vendor:product:version" }
        scan: { $ref: "#/components/schemas/ServiceFields" }
        overridden: { type: array, items: { type: string, enum: [name, product, version] } }
        banner: { type: string, description: decrypted }
        state: { type: string, enum: [open, gone] }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        overrides: { type: object, additionalProperties: true }
    ServiceList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Service" } }
        total: { type: integer }
    HttpObservation:
      type: object
      description: |
        Decrypted on read. Storage format (for the S4 ingest): headers_enc = JSON object of strings,
        cookies_enc = JSON array of strings, tls_cert_enc = text; redirects jsonb = array of strings.
      required: [id, service_id, url, status, title, headers, cookies, tls_cert, redirects, technologies, favicon_hash, run_id, observed_at]
      properties:
        id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64 }
        url: { type: string }
        status: { type: [integer, "null"] }
        title: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        cookies: { type: array, items: { type: string } }
        tls_cert: { type: string }
        redirects: { type: array, items: { type: string } }
        technologies: { type: array, items: { type: string } }
        favicon_hash: { type: string }
        run_id: { type: [integer, "null"], format: int64 }
        observed_at: { type: string, format: date-time }

    CveHit:
      type: object
      required: [id, cvss, kev, epss]
      properties:
        id: { type: string, examples: ["CVE-2021-41773"] }
        cvss: { type: number }
        kev: { type: boolean }
        epss: { type: number }
    CveMatch:
      type: object
      required: [ip, port, proto, product, cpe, version, cves, max_cvss, kev, distro, confidence, severity, matched_at]
      properties:
        ip: { type: string }
        port: { type: integer }
        proto: { type: string }
        product: { type: string, examples: ["Apache httpd"] }
        cpe: { type: string, examples: ["apache:http_server"] }
        version: { type: string, examples: ["2.4.49"] }
        cves: { type: array, items: { $ref: "#/components/schemas/CveHit" } }
        max_cvss: { type: number }
        kev: { type: integer, description: Number of CVEs in CISA KEV. }
        distro: { type: boolean }
        confidence: { type: string, enum: [high, low] }
        severity: { $ref: "#/components/schemas/Severity" }
        matched_at: { type: string, format: date-time }
    CveMatchList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CveMatch" } }
        total: { type: integer }

    # ── findings ──
    Finding:
      type: object
      required: [id, title, severity, active]
      properties:
        id: { type: integer, format: int64, description: Dojo finding id }
        asset_id: { type: [integer, "null"], format: int64 }
        ip: { type: [string, "null"] }
        title: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        active: { type: boolean }
        verified: { type: boolean }
        false_p: { type: boolean }
        risk_accepted: { type: boolean }
        is_mitigated: { type: boolean }
        tags: { type: array, items: { type: string } }
        scanner: { type: string }
        date: { type: [string, "null"], format: date }
        dojo_url: { type: string, description: "Link to the finding in the Dojo UI (ASI_DOJO_PUBLIC_URL); empty if Dojo is not configured." }
    FindingPatch:
      type: object
      properties:
        severity: { $ref: "#/components/schemas/Severity" }
        active: { type: boolean }
        verified: { type: boolean }
        false_p: { type: boolean }
        risk_accepted: { type: boolean }
        is_mitigated: { type: boolean }
    FindingList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        total: { type: integer }

    # ── changes ──
    DiffRun:
      type: object
      required: [id, profile_id, status, started_at, finished_at]
      properties:
        id: { type: integer, format: int64 }
        profile_id: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/RunStatus" }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    DiffSummary:
      type: object
      required: [hosts_new, hosts_gone, services_new, services_gone, services_changed]
      properties:
        hosts_new: { type: integer }
        hosts_gone: { type: integer }
        services_new: { type: integer }
        services_gone: { type: integer }
        services_changed: { type: integer }
    HostChange:
      type: object
      required: [ip, other_run, ports]
      properties:
        ip: { type: string }
        other_run: { type: string, enum: [down, not_scanned], description: "the host's state in the run where it wasn't up" }
        ports: { type: array, items: { type: integer }, description: "open ports in the run where it was up" }
    ServiceFingerprint:
      type: object
      required: [name, product, version, title, technologies]
      properties:
        name: { type: string }
        product: { type: string }
        version: { type: string }
        title: { type: string }
        technologies: { type: array, items: { type: string } }
    ServiceChange:
      type: object
      required: [ip, port, proto, before, after, fields]
      properties:
        ip: { type: string }
        port: { type: integer }
        proto: { type: string }
        before: { oneOf: [{ $ref: "#/components/schemas/ServiceFingerprint" }, { type: "null" }], description: "null for new services" }
        after: { oneOf: [{ $ref: "#/components/schemas/ServiceFingerprint" }, { type: "null" }], description: "null for gone services" }
        fields:
          type: array
          items: { type: string, enum: [name, product, version, title, technologies] }
          description: changed fields (only for changed services)
    RunDiff:
      type: object
      required: [from, to, summary, hosts_new, hosts_gone, services_new, services_gone, services_changed, truncated]
      properties:
        from: { $ref: "#/components/schemas/DiffRun" }
        to: { $ref: "#/components/schemas/DiffRun" }
        summary: { $ref: "#/components/schemas/DiffSummary" }
        hosts_new: { type: array, items: { $ref: "#/components/schemas/HostChange" } }
        hosts_gone: { type: array, items: { $ref: "#/components/schemas/HostChange" } }
        services_new: { type: array, items: { $ref: "#/components/schemas/ServiceChange" } }
        services_gone: { type: array, items: { $ref: "#/components/schemas/ServiceChange" } }
        services_changed: { type: array, items: { $ref: "#/components/schemas/ServiceChange" } }
        truncated: { type: boolean, description: "some list was cut at limit" }
    HostTimelineRun:
      type: object
      required: [run, up, observed_at, open_ports]
      properties:
        run: { $ref: "#/components/schemas/DiffRun" }
        up: { type: boolean }
        observed_at: { type: string, format: date-time }
        open_ports: { type: array, items: { type: integer } }
    HostTimeline:
      type: object
      required: [ip, ports, runs]
      properties:
        ip: { type: string }
        ports: { type: array, items: { type: integer }, description: "every port open in any of the runs" }
        runs: { type: array, items: { $ref: "#/components/schemas/HostTimelineRun" } }

    # ── profiles / schedules ──
    ProfileInput:
      type: object
      required: [name, ports]
      properties:
        name: { type: string }
        ports: { type: string, description: "port spec from the allowed list" }
        nmap_max_rate: { type: integer, minimum: 1 }
        nuclei_rate: { type: integer, minimum: 1 }
        nuclei_tags: { type: array, items: { type: string } }
        miss_threshold: { type: integer, minimum: 1 }
        target_batch_seconds: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [id, nmap_max_rate, enabled]
          properties:
            id: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }
    ProfileList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Profile" } }
        total: { type: integer }
    ScheduleInput:
      type: object
      required: [profile_id]
      properties:
        profile_id: { type: integer, format: int64 }
        cron: { type: [string, "null"] }
        window_start: { type: [string, "null"], format: date-time }
        window_end: { type: [string, "null"], format: date-time }
        timezone: { type: string, default: Europe/Warsaw }
        enabled: { type: boolean }
    Schedule:
      allOf:
        - $ref: "#/components/schemas/ScheduleInput"
        - type: object
          required: [id, source]
          properties:
            id: { type: integer, format: int64 }
            source: { type: string, enum: [ui, dojo] }
            dojo_engagement_id: { type: [integer, "null"], format: int64 }
    ScheduleList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Schedule" } }
        total: { type: integer }

    # ── signatures ──
    SignatureInput:
      type: object
      description: A nuclei template. Its `id` becomes the signature name and must be unique.
      required: [template_yaml]
      properties:
        template_yaml: { type: string }
        enabled: { type: boolean, description: "Default true; an invalid template is always stored disabled." }
    SignatureUpdate:
      type: object
      description: Partial update. Built-ins accept only `enabled`.
      properties:
        template_yaml: { type: string }
        enabled: { type: boolean }
    Signature:
      type: object
      required: [id, name, template_yaml, enabled, valid, validation_error, builtin, created_by, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: The template id. }
        template_yaml: { type: string }
        enabled: { type: boolean }
        valid: { type: boolean }
        validation_error: { type: string }
        builtin: { type: boolean, description: "Shipped in signatures/: can be disabled, not edited or deleted." }
        created_by: { type: [integer, "null"], format: int64 }
        created_at: { type: string, format: date-time }
    SignatureIssue:
      type: object
      required: [line, message]
      properties:
        line: { type: integer, description: "1-based line in the YAML; 0 = no position." }
        message: { type: string }
    SignatureValidation:
      type: object
      required: [valid, errors, issues, id, name, severity, tags]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string }, description: '"line N: message" strings.' }
        issues: { type: array, items: { $ref: "#/components/schemas/SignatureIssue" } }
        id: { type: string }
        name: { type: string }
        severity: { type: string }
        tags: { type: array, items: { type: string } }
    SignatureInvalid:
      type: object
      required: [error, issues]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [invalid_signature] }
            message: { type: string }
        issues: { type: array, items: { $ref: "#/components/schemas/SignatureIssue" } }
    SignatureList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Signature" } }
        total: { type: integer }
