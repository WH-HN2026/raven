# RAVEN deployment (architecture §10):  scripts/gen-env.sh && docker compose up -d --build
# Dev infra (everything except raven):    make infra-up
name: raven

include:
  - path: deploy/dojo.compose.yml
    env_file: .env

services:
  raven:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: raven:local
    restart: unless-stopped
    depends_on:
      raven-db:
        condition: service_healthy
    cap_add: [NET_RAW, NET_ADMIN]   # nmap -sS / host discovery
    ports:
      - "${RAVEN_PORT:-8000}:8000"
    environment:
      RAVEN_HTTP_ADDR: ":8000"
      RAVEN_DATABASE_URL: "postgres://raven:${RAVEN_DB_PASSWORD:?run scripts/gen-env.sh}@raven-db:5432/raven?sslmode=disable"
      RAVEN_ENCRYPTION_KEY: "${RAVEN_ENCRYPTION_KEY:?run scripts/gen-env.sh}"
      RAVEN_DOJO_URL: "${RAVEN_DOJO_URL:-http://nginx:8080}"
      RAVEN_DOJO_PUBLIC_URL: "${RAVEN_DOJO_PUBLIC_URL:-http://localhost:${DD_PORT:-18080}}"
      RAVEN_DOJO_TOKEN: "${RAVEN_DOJO_TOKEN:-}"
      RAVEN_DOJO_ORGANIZATION: "${RAVEN_DOJO_ORGANIZATION:-RAVEN}"
      DD_ADMIN_USER: "${DD_ADMIN_USER:-admin}"
      DD_ADMIN_PASSWORD: "${DD_ADMIN_PASSWORD:?run scripts/gen-env.sh}"
      RAVEN_ADMIN_USERNAME: "${RAVEN_ADMIN_USERNAME:-admin}"
      RAVEN_ADMIN_PASSWORD: "${RAVEN_ADMIN_PASSWORD:?run scripts/gen-env.sh}"
      RAVEN_COOKIE_SECURE: "${RAVEN_COOKIE_SECURE:-false}"
      RAVEN_SESSION_TTL: "${RAVEN_SESSION_TTL:-12h}"
      RAVEN_MAX_WORKERS: "${RAVEN_MAX_WORKERS:-2}"
      RAVEN_ZAP_URL: "${RAVEN_ZAP_URL:-}"
      RAVEN_ZAP_API_KEY: "${RAVEN_ZAP_API_KEY:-}"
    networks:
      - default
      - zap-internal
    # Our lab: attach to raven_lab with `-f lab/raven.compose.yml`. The organizers'
    # stacks (lab/organizers) are reached from here at the docker0 gateway 172.17.0.1
    # (profile "Organizers' lab"); no extra network is needed (docs/lab.md).

  zap:
    profiles: ["aggressive"]
    image: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    restart: unless-stopped
    # API is internal-only: no published ports, no internet egress on zap-internal.
    # Attach to the lab network with `-f lab/raven.compose.yml` (also internal: true).
    environment:
      RAVEN_ZAP_API_KEY: "${RAVEN_ZAP_API_KEY:-}"
    command:
      - /bin/sh
      - -ec
      - |
        test -n "$$RAVEN_ZAP_API_KEY" || { echo "RAVEN_ZAP_API_KEY is required (run scripts/gen-env.sh)" >&2; exit 1; }
        exec zap.sh -daemon -silent -host 0.0.0.0 -port 8080 \
          -config "api.key=$$RAVEN_ZAP_API_KEY" \
          -config 'api.addrs.addr.name=^(zap|localhost|127\.0\.0\.1|10\..*|172\.(1[6-9]|2[0-9]|3[0-1])\..*|192\.168\..*)$' \
          -config api.addrs.addr.regex=true \
          -config start.checkForUpdates=false \
          -config start.checkAddonUpdates=false \
          -config start.installAddonUpdates=false \
          -config start.installScannerRules=false \
          -config start.reportReleaseAddons=false \
          -config start.reportBetaAddons=false \
          -config start.reportAlphaAddons=false \
          -config start.downloadNewRelease=false \
          -config network.connection.timeoutInSecs=15
    networks:
      - zap-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"X-ZAP-API-Key: $$RAVEN_ZAP_API_KEY\" http://127.0.0.1:8080/JSON/core/view/version/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  raven-db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    # Statement logging must stay off: queries carry the encryption key (raven.enc_key).
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_duration_statement=-1"]
    environment:
      POSTGRES_USER: raven
      POSTGRES_PASSWORD: "${RAVEN_DB_PASSWORD:?run scripts/gen-env.sh}"
      POSTGRES_DB: raven
    ports:
      - "127.0.0.1:${RAVEN_DB_PORT:-5433}:5432"   # dev access (scripts/wt-env.sh); localhost only
    volumes:
      - raven-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raven -d raven"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  raven-db-data: {}

networks:
  zap-internal:
    internal: true
