<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASI – Top bar</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&amp;family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>

</style>
</helmet>
<header style="background: #000000; color: #FFFFFF; font-family: Roboto, 'Helvetica Neue', Arial, sans-serif; width: 100%">

    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 14px; color: #FFFFFF; text-decoration: none; padding: 12px 0">
      <svg role="img" aria-label="AGH" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430.66 836" width="28" height="54" fill="#FFFFFF"><path d="M86.94,833.05h36.13l-40-112.48C78.58,707.92,68.89,706,65.79,706H30.87c5.36,4.37,7.21,7.230,7.21,11.62,0,2.67-.59,4.71-3.51,13.33L0,833.05H23.61l10.45-31.68H76.21ZM69.54,781.7h-29l14.29-43.36Z"></path><path d="M233.44,815V774.51c0-7.76-1.640-11.72-7.15-16.63h26.1a15,15,0,0,1,15,14.78v57.52A135.18,135.18,0,0,1,229.88,836c-45.17,0-73.8-26.34-73.8-65.32,0-38.06,28.69-67.71,74.420-67.71A85.76,85.76,0,0,1,259.75,708v25.43A53.19,53.19,0,0,0,230.5,725c-21.92,0-39.19,15.11-39.19,43,0,29.61,13.08,47.75,34.07,47.75A39.76,39.76,0,0,0,233.44,815Z"></path><path d="M357.85,722.39a16.2,16.2,0,0,0-16-16.41H316.58c5.51,4.9,7.15,8.87,7.15,16.62V833.05h34.12V779.62h38.79v53.43h34V706.35h-34v51.72H357.85Z"></path><path d="M307.1,621.26c28.25-19.41,52.95-49.42,53-113V127.08h28.23V508.3C388.29,578.9,353,607.14,307.1,621.26Z"></path><path d="M330.07,621.26c26.47-12.35,72.36-35.3,72.36-113V127.08h28.23V508.3C430.66,603.61,356.54,617.73,330.07,621.26Z"></path><path d="M289.45,621.26c21.08-21.19,28.24-63.53,28.24-120V127.08h28.25V508.3C345.94,571.65,324.76,603.61,289.45,621.26Z"></path><path d="M151.8,0C180,19.41,204.74,49.42,204.75,113v437.7H233V113C233,42.36,197.68,14.12,151.8,0Z"></path><path d="M174.76,0c26.47,12.36,72.36,35.3,72.36,113v437.7h28.23V113C275.35,17.65,201.23,3.53,174.76,0Z"></path><path d="M134.15,0c21.07,21.18,28.23,63.54,28.23,120V550.66h28.25V113C190.63,49.61,169.45,17.65,134.15,0Z"></path><path d="M130.62,621.26c-28.24-19.41-52.94-49.42-52.95-113V127.08H49.43V508.3C49.43,578.9,84.73,607.14,130.62,621.26Z"></path><path d="M107.66,621.26C81.18,608.91,35.3,586,35.3,508.3V127.08H7.06V508.3C7.06,603.61,81.18,617.73,107.66,621.26Z"></path><path d="M148.27,621.26C127.2,600.07,120,557.73,120,501.24V127.08H91.79V508.3C91.79,571.65,113,603.61,148.27,621.26Z"></path></svg>
      <span style="display: flex; flex-direction: column; border-left: 1px solid #666666; padding-left: 14px">
        <span style="font-size: 22px; font-weight: 500; letter-spacing: 0.08em; line-height: 1.1">ASI</span>
        <span style="font-size: 12px; font-weight: 300; color: #BDBDBD">Attack Surface Intelligence</span>
      </span>
    </a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: stretch; flex: 1 1 560px">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="8">
        <a href="{{i.href}}" style="display: flex; align-items: center; padding: 0 13px; min-height: 80px; box-sizing: border-box; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: {{i.weight}}; border-bottom: 4px solid {{i.bar}}; border-top: 4px solid transparent">{{i.label}}</a>
      </sc-for>
    </nav>
    <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 0">
      <a href="#" style="color: #FFFFFF; font-size: 13px; text-decoration: none; border-bottom: 1px solid #C10D14">DefectDojo ↗</a>
      <span style="display: flex; align-items: center; gap: 10px">
        <span style="font-size: 14px">{{user}}</span>
        <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; background: #C10D14; color: #FFFFFF">{{roleLabel}}</span>
      </span>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","hosts","changes","findings","runs","targets","signatures","io","users"],"default":"dashboard"},"role":{"editor":"enum","options":["admin","editor","operator","viewer"],"default":"editor"},"$preview":{"width":1440,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'dashboard';
    var role = this.props.role ?? 'editor';
    var list = [
      ['dashboard', 'Dashboard', 'Main.dc.html'],
      ['hosts', 'Hosts', 'Hosts.dc.html'],
      ['changes', 'Changes', 'Changes.dc.html'],
      ['findings', 'Findings', 'Findings.dc.html'],
      ['runs', 'Runs', 'Scans.dc.html'],
      ['targets', 'Targets', 'Targets.dc.html'],
      ['signatures', 'Signatures', '#'],
      ['io', 'Import/Export', '#']
    ];
    // Navigation is role-aware: only admins see user management.
    if (role === 'admin') list.push(['users', 'Users', '#']);
    var items = list.map(function (x) {
      var on = x[0] === active;
      return { label: x[1], href: x[2], bar: on ? '#C10D14' : 'transparent', weight: on ? '500' : '400' };
    });
    var labels = { admin: 'Admin', editor: 'Editor', operator: 'Operator', viewer: 'Viewer' };
    return { items: items, user: 'a.nowak', roleLabel: labels[role] };
  }
}
</script>
</body>
</html>
