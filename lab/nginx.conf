server {
    listen 80 default_server;
    server_name _;
    default_type text/html;

    location = /admin {
        add_header X-Lab-Panel admin;
        return 200 '<!doctype html><title>RAVEN Admin Panel</title><h1>Admin Panel</h1>';
    }

    location = / {
        return 200 '<!doctype html><title>RAVEN nginx Lab</title><a href="/admin">Admin Panel</a>';
    }
}
