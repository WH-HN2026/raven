id: vlab-dvwa-security-cookie
info:
  name: DVWA security level cookie
  author: raven-vlab
  severity: low
  description: The response sets DVWA's "security" cookie, which names the app's vulnerability level (low on a fresh install).
  tags: vlab,dvwa,cookies
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers:
      - type: regex
        part: header
        regex:
          - '(?mi)^set-cookie:[ \t]*security=(low|medium|high|impossible)\b'
    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?mi)^set-cookie:[ \t]*security=([a-z]+)'
