name: asi-lab

x-fixture: &fixture
  image: asi-lab-fixtures:local
  build: ./lab/fixtures
  healthcheck: &http-health
    test: [CMD, wget, -q, --spider, 'http://127.0.0.1/']
    interval: 5s
    timeout: 3s
    retries: 12

x-cms-health: &cms-health
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 30s

x-db: &db
  image: mariadb:11.8
  healthcheck:
    test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 30s

services:
  # CMS database passwords are disposable fixture values for this network.
  wordpress:
    build: ./lab/wordpress
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-lab
      WORDPRESS_CONFIG_EXTRA: define('AUTOMATIC_UPDATER_DISABLED', true);
    depends_on:
      wordpress-db:
        condition: service_healthy
    healthcheck:
      <<: *cms-health
      test: [CMD, php, -r, 'exit(str_contains((string) @file_get_contents("http://172.30.0.17/"), "wp-content") ? 0 : 1);']
    volumes:
      - wordpress-data:/var/www/html
    networks:
      lab:
        ipv4_address: 172.30.0.17

  joomla:
    image: joomla:6-php8.4-apache
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export JOOMLA_ADMIN_PASSWORD="$$(php -r 'echo bin2hex(random_bytes(24));')"
        exec /entrypoint.sh apache2-foreground
    environment:
      JOOMLA_DB_HOST: joomla-db
      JOOMLA_DB_NAME: joomla
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: joomla-lab
      JOOMLA_SITE_NAME: ASI Joomla Lab
      JOOMLA_ADMIN_USER: Lab Administrator
      JOOMLA_ADMIN_USERNAME: lab-admin
      JOOMLA_ADMIN_EMAIL: admin@example.invalid
    depends_on:
      joomla-db:
        condition: service_healthy
    healthcheck:
      <<: *cms-health
      test: [CMD, php, -r, 'exit(str_contains((string) @file_get_contents("http://127.0.0.1/"), "Joomla! - Open Source Content Management") ? 0 : 1);']
    volumes:
      - joomla-data:/var/www/html
    networks:
      lab:
        ipv4_address: 172.30.0.18

  nginx-panel:
    image: nginx:stable-alpine
    volumes:
      - ./lab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck: *http-health
    networks:
      lab:
        ipv4_address: 172.30.0.19

  staging:
    <<: *fixture
    command: [staging]
    networks:
      lab:
        ipv4_address: 172.30.0.20

  tomcat:
    build: ./lab/tomcat
    healthcheck:
      <<: *cms-health
      test: [CMD, curl, --fail, --silent, --output, /dev/null, 'http://127.0.0.1:8080/']
    networks:
      lab:
        ipv4_address: 172.30.0.21

  printer:
    <<: *fixture
    command: [printer]
    networks:
      lab:
        ipv4_address: 172.30.0.22

  tls-selfsigned:
    <<: *fixture
    command: [tls-selfsigned]
    healthcheck: &tls-health
      <<: *http-health
      test: [CMD, wget, -q, --spider, --no-check-certificate, 'https://127.0.0.1/']
    networks:
      lab:
        ipv4_address: 172.30.0.23

  tls-expired:
    <<: *fixture
    command: [tls-expired]
    healthcheck: *tls-health
    networks:
      lab:
        ipv4_address: 172.30.0.24

  apache-banner:
    <<: *fixture
    command: [apache]
    networks:
      lab:
        ipv4_address: 172.30.0.25

  ssh-banner:
    <<: *fixture
    command: [ssh]
    healthcheck:
      <<: *http-health
      test: [CMD-SHELL, 'nc -w 2 127.0.0.1 22 </dev/null | grep -q "^SSH-2.0-OpenSSH_7.4"']
    networks:
      lab:
        ipv4_address: 172.30.0.26

  flap:
    <<: *fixture
    command: [flap]
    networks:
      lab:
        ipv4_address: 172.30.0.27

  wordpress-db:
    <<: *db
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
      MARIADB_ROOT_HOST: localhost
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress-lab
    volumes:
      - wordpress-db-data:/var/lib/mysql
    networks:
      lab:
        ipv4_address: 172.30.0.28

  joomla-db:
    <<: *db
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
      MARIADB_ROOT_HOST: localhost
      MARIADB_DATABASE: joomla
      MARIADB_USER: joomla
      MARIADB_PASSWORD: joomla-lab
    volumes:
      - joomla-db-data:/var/lib/mysql
    networks:
      lab:
        ipv4_address: 172.30.0.29

networks:
  lab:
    name: asi_lab
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
          ip_range: 172.30.0.128/25

volumes:
  wordpress-data:
  joomla-data:
  wordpress-db-data:
  joomla-db-data:
